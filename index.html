<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShopLite — a small demo storefront." />
  <title>ShopLite</title>

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" data-link>ShopLite</a>

      <nav aria-label="Primary">
        <ul class="nav-list">
          <li><a href="/" data-link>Home</a></li>
          <li><a href="/cart" data-link>Cart</a></li>
        </ul>
      </nav>

      <a href="/cart" class="cart-button" data-link aria-label="Cart, 0 items">
        <span aria-hidden="true">🛒</span>
        <span class="cart-count" data-cart-count>0</span>
      </a>
    </div>

    <!-- Screen-reader announcements for cart updates -->
    <p class="visually-hidden" aria-live="polite" data-live-region></p>
  </header>

  <main id="main" class="container" tabindex="-1" data-outlet>
    <!-- Views render here -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span data-year></span> ShopLite.</p>
    </div>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
